# Merged on top of upstream's docker-compose.yml by bootstrap.sh (copied into upstream/).
# Adds Caddy for HTTPS; the app stays on loopback (upstream default) and Postgres is never published.
services:
  caddy:
    image: mirror.gcr.io/library/caddy:2.11-alpine # Docker Hub mirror: no pull rate limit
    restart: unless-stopped
    network_mode: host # reach the app on 127.0.0.1:3000
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - openmaic

  openmaic:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
